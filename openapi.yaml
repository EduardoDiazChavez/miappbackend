openapi: 3.1.0
info:
  title: MiApp API
  version: 0.1.0
  description: Role-aware ticket, client and service-team API.
servers:
  - url: http://localhost:3001
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: API health
  /auth/client/login:
    post:
      security: []
      summary: Start a client session with invited account credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200": { description: Client session created }
        "401": { description: Invalid credentials }
  /auth/google:
    post:
      security: []
      summary: Verify Google ID token for a previously authorized internal account
      responses:
        "200": { description: Internal session created }
        "403": { description: Account not authorized for internal access }
  /auth/me:
    get:
      responses:
        "200": { description: Current authenticated user }
        "401": { description: No active session }
  /auth/logout:
    post:
      responses:
        "204": { description: Session cookie cleared }
  /tickets:
    get:
      summary: List tickets, scoped to the client's organization when role is CLIENT
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, IN_PROGRESS, WAITING, CLOSED] }
      responses:
        "200": { description: Paginated ticket list }
        "401": { description: No active session }
    post:
      summary: Create a ticket for an enabled organization (internal roles only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, process, description]
              properties:
                organizationId: { type: string }
                process: { type: string, minLength: 3, maxLength: 160 }
                description: { type: string, minLength: 5, maxLength: 5000 }
      responses:
        "201": { description: Ticket created and initial history message recorded }
        "403": { description: Client role cannot create tickets, or organization ticket creation is disabled }
  /tickets/organizations:
    get:
      summary: List active organizations where ticket creation is enabled, including ticket-code initials
      responses:
        "200": { description: Available organizations }
        "401": { description: No active session }
  /tickets/{idOrCode}:
    get:
      summary: Get ticket and role-visible message history
      parameters:
        - in: path
          name: idOrCode
          required: true
          schema: { type: string }
      responses:
        "200": { description: Ticket details }
        "404": { description: Ticket not found or outside client organization }
  /tickets/{idOrCode}/messages:
    post:
      summary: Add a client-visible ticket message
      parameters:
        - in: path
          name: idOrCode
          required: true
          schema: { type: string }
      responses:
        "201": { description: Message saved }
        "404": { description: Ticket not found or outside client organization }
  /tickets/{idOrCode}/status:
    patch:
      summary: Change ticket status (internal roles only)
      parameters:
        - in: path
          name: idOrCode
          required: true
          schema: { type: string }
      responses:
        "200": { description: Ticket updated and history message recorded }
        "403": { description: Client role cannot change status }
  /tickets/{idOrCode}/sheets-sync:
    post:
      summary: Synchronize a closed ticket with Google Sheets (internal roles only)
      parameters:
        - in: path
          name: idOrCode
          required: true
          schema: { type: string }
      responses:
        "200": { description: Ticket synchronized with Google Sheets }
        "404": { description: Ticket not found or outside the user's scope }
        "409": { description: Ticket is not closed or no active workbook/tab is configured }
        "502": { description: Google Sheets synchronization failed }
        "503": { description: Google Sheets is not configured }
  /admin/organizations:
    get:
      summary: List active, blocked and archived organizations (ADMIN or SUPER_ADMIN)
      responses:
        "200": { description: Organizations with initials, access and ticket-creation settings }
    post:
      summary: Create a client organization with unique ticket-code initials (ADMIN or SUPER_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                code: { type: string, pattern: "^[A-Z0-9]{2,8}$" }
      responses:
        "201": { description: Organization created }
        "409": { description: Name or initials already in use }
  /admin/organizations/{organizationId}:
    patch:
      summary: Edit, block, archive or restore a client organization (ADMIN or SUPER_ADMIN)
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                code: { type: string, pattern: "^[A-Z0-9]{2,8}$" }
                active: { type: boolean }
                allowTicketCreation: { type: boolean }
                archived: { type: boolean, description: "Archiving blocks access and ticket creation while preserving history." }
      responses:
        "200": { description: Organization updated }
        "404": { description: Organization not found }
  /admin/sheets/workbooks:
    get:
      summary: List ticket-generating users, active organizations and monthly workbook mappings (ADMIN or SUPER_ADMIN)
      responses:
        "200": { description: User, organization and workbook configuration }
    post:
      summary: Configure and activate a monthly workbook for one ticket-generating user (ADMIN or SUPER_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, periodLabel, spreadsheetId, organizationSheets]
              properties:
                userId: { type: string }
                periodLabel: { type: string, maxLength: 80 }
                spreadsheetId: { type: string, description: Google Sheets URL or ID }
                organizationSheets:
                  type: array
                  items:
                    type: object
                    required: [organizationId, sheetId]
                    properties:
                      organizationId: { type: string }
                      sheetId: { type: integer, minimum: 0 }
      responses:
        "201": { description: Workbook configured and activated }
        "400": { description: Invalid mappings or missing company tabs }
        "409": { description: A workbook already exists for that user and period }
        "503": { description: Google Sheets credentials are not configured }
  /admin/sheets/tabs:
    get:
      summary: Read spreadsheet title, time zone and existing tabs (ADMIN or SUPER_ADMIN)
      parameters:
        - in: query
          name: spreadsheetId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Spreadsheet metadata and tabs }
        "502": { description: Spreadsheet is inaccessible to the service account }
  /admin/sheets/workbooks/{workbookId}/mappings:
    put:
      summary: Update company-to-tab mappings for a monthly workbook (ADMIN or SUPER_ADMIN)
      parameters:
        - in: path
          name: workbookId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Company tabs updated }
        "400": { description: Invalid or incomplete mappings }
  /admin/sheets/workbooks/{workbookId}/activate:
    post:
      summary: Activate a previously configured monthly workbook (ADMIN or SUPER_ADMIN)
      parameters:
        - in: path
          name: workbookId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Workbook activated and previous user workbook closed }
  /admin/invitations/clients:
    post:
      summary: Create a one-time client invitation (ADMIN or SUPER_ADMIN)
      responses:
        "201": { description: Single-use invitation URL, expires after 72 hours }
  /admin/users/internal:
    post:
      summary: Allowlist an advisor for Google sign-in (ADMIN or SUPER_ADMIN)
      responses:
        "201": { description: Internal account authorized }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: miapp_session
